# Testlar (22/#10): har push va pull request'da — unit/komponent (coverage
# chegarasi bilan), haqiqiy brauzerdagi komponent testlari va story'lar
# (#12), e2e.
# pages.yml deploydan oldin "npm run check" ni o'zi bajaradi; bu fayl —
# PR'larda ham, sekin testlar bilan. Uchala job parallel.
name: Testlar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

# Bir branch'ga ketma-ket push — eskisi bekor qilinadi (daqiqa tejaladi)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest: mantiq + komponent (jsdom); chegara (thresholds) tushsa — yiqiladi
      - run: npm run test:qamrov
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: qamrov
          path: coverage/
          retention-days: 7

  brauzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ubuntu-latest da Google Chrome oldindan o'rnatilgan — testlar
      # channel: "chrome" bilan uni ishlatadi, Playwright brauzer yuklamaydi.
      # Runner rasmida Chrome bo'lmasa: npx playwright install --with-deps chrome
      - run: npm run test:brauzer
      # 22/#12: story'lar — render, play, a11y (axe) — o'sha Chrome'da
      - run: npm run test:storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI=true (GitHub o'zi qo'yadi): retries 2, trace on-first-retry,
      # forbidOnly, "github" reporter — xatolar PR'da izoh bo'lib chiqadi
      # Visual regression (npm run test:vizual) bu yerda YO'Q: oltin rasmlar
      # Windows'da yaratilgan (*-vizual-win32.png), Linux runner ularni
      # topmaydi va shriftni boshqacha chizadi. CI'ga qo'shish uchun avval
      # Linux rasmlari: Playwright Docker obrazida --update-snapshots (#13)
      - run: npm run test:e2e
      # Hisobot va trace'lar — yiqilganda ko'rish uchun (npx playwright
      # show-report / show-trace). !cancelled(): test yiqilsa ham yuklanadi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
