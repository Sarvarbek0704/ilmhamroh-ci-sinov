# docker/nginx.conf — web konteyneri ichidagi nginx (33 #32): statik fayllar + /v1/ → api:3000 (Compose ichki tarmog'i; api porti tashqariga ochilmagan).
# TLS, xavfsizlik sarlavhalari va tezlik limitlari — tashqi (host) nginx'da (deploy/nginx/vazifalar.conf). Bu yerda — X-Forwarded-For zanjiri davom ettiriladi
# 34 #07 (O-49): api — upstream orqali, ikki nusxa (`api`, `api-yashil`; ikkinchisi faqat compose.bluegreen.yaml bilan bor).
#   `resolve` (nginx 1.27.3+ ochiq versiyada) — nomni ishga tushishdagina emas, `valid` muddatida qayta so'raydi: konteyner qayta yaratilib IP o'zgarsa
#   yoki nusxa yo'q bo'lsa ham nginx ishlaydi (33 #32: "host not found in upstream \"api\"" — nginx ishga tushmasdi). 127.0.0.11 — Docker ichki DNS.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api {
    zone api 64k;
    server api:3000 resolve max_fails=1 fail_timeout=3s;
    server api-yashil:3000 resolve max_fails=1 fail_timeout=3s;
    keepalive 16;
}
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location /v1/ {
        proxy_pass http://api;
        # nusxa to'xtayotganda (ulanish rad etildi/502/503) — so'rov ikkinchisiga; POST faqat ulanish o'rnatilmagan bo'lsa (nginx sukuti)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # host nginx $remote_addr yuboradi; bu yerda zanjirga host nginx IP'si qo'shiladi → API: TRUST_PROXY=2
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        location ~ ^/assets/(js|ikonlar)/ { add_header Cache-Control "public, max-age=3600"; }
    }
    location ~* ^/(?!v1/).*\.(png|jpe?g|gif|svg|ico|webp|js|css|map|json|txt|woff2?)$ { try_files $uri =404; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
