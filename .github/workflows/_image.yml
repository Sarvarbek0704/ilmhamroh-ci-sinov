# .github/workflows/_image.yml — 34-qism #04/#06 (O-46): QAYTA ISHLATILADIGAN workflow (workflow_call) — bitta papkadan arm64 image → GHCR.
#   Chaqirish: jobs.<id>.uses: ./.github/workflows/_image.yml  with: { nom: api, papka: vazifalar-api, sha: … }
#   Composite action'dan farqi: butun JOB (o'z runner'i, permissions, outputs); chaqiruvchi `permissions` ni beradi (packages: write).
name: _image

on:
  workflow_call:
    inputs:
      nom: { type: string, required: true }
      papka: { type: string, required: true }
      sha: { type: string, required: true }
    outputs:
      teg:
        description: image tegi (sha-<40 hex>)
        value: ${{ jobs.qur.outputs.teg }}

permissions:
  contents: read
  packages: write

jobs:
  qur:
    name: ${{ inputs.nom }} (linux/arm64)
    runs-on: ubuntu-24.04-arm          # server ARM64 — native build (33 #34: lokal QEMU emulyatsiyasi Docker Desktop'ni osdirdi)
    timeout-minutes: 20
    outputs:
      teg: ${{ steps.teg.outputs.teg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - id: teg
        env:
          SHA: ${{ inputs.sha }}
        run: echo "teg=sha-$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.papka }}
          platforms: linux/arm64
          push: true
          provenance: false               # bitta manifest (attestation indeksi yo'q) — server `docker pull` oddiy
          tags: ghcr.io/sarvarbek0704/ilmhamroh-ci-sinov/${{ inputs.nom }}:${{ steps.teg.outputs.teg }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          build-args: |
            VITE_API_URL=/v1
          # #04: BuildKit qatlam keshi GitHub Actions kesh xizmatida (scope — image bo'yicha alohida)
          cache-from: type=gha,scope=${{ inputs.nom }}-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.nom }}-arm64
