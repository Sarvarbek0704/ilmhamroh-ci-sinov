# .github/workflows/ci.yml — 34-qism #02 (O-44): har push/PR'da tekshiruv — lokal `npm run check` bilan AYNAN bir xil qadamlar.
#   Monorepo (sinov repo): vazifalar-api/ (backend) va vazifalar/ (web). Har job faqat o'z papkasi o'zgarganda (paths) — hujjat PR'lari daqiqa yemaydi.
#   Begona action'lar SHA bilan qotirilgan (#03): teg ko'chishi mumkin, commit SHA — yo'q. Izohdagi teg — o'qish uchun.
name: CI

on:
  push:
    branches: [main]
    paths: ["vazifalar-api/**", "vazifalar/**", "sql/**", ".github/workflows/ci.yml", ".github/actions/**"]
  pull_request:
    paths: ["vazifalar-api/**", "vazifalar/**", "sql/**", ".github/workflows/ci.yml", ".github/actions/**"]
  workflow_dispatch:

# #03: GITHUB_TOKEN — eng kam ruxsat (sukut: repo sozlamasiga bog'liq). Job o'ziga kerak bo'lsa — job darajasida kengaytiradi
permissions:
  contents: read

env:
  HUSKY: 0           # web: npm ci dagi "prepare": "husky" CI'da kerak emas

# #04: bir branch/PR'ga ketma-ket push — eski yugurish BEKOR qilinadi (natijasi baribir eskirgan; daqiqa tejaladi)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (tip, lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vazifalar-api
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.4
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      # 33 BACKLOG 2: S3 (RustFS) va pochta (Mailpit) — Actions'da birinchi haqiqiy yugurish. `services` da `command` yo'q — RustFS sukut CMD bilan
      s3:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: ci-sinov-kalit
          RUSTFS_SECRET_KEY: ci-sinov-siri-faqat-test
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test
      TEST_PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test_prisma
      TEST_AUTH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar_test_auth
      TEST_NAMUNA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/vazifalar
      TEST_REDIS_URL: redis://127.0.0.1:6379
      # sinov qiymatlari — sir EMAS (faqat shu job ichidagi vaqtinchalik konteyner)
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_KALIT: ci-sinov-kalit
      S3_SIR: ci-sinov-siri-faqat-test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAILPIT_API: http://127.0.0.1:8025
      KANON_TLS: /tmp/vazifalar-tls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-tayyorla
        with:
          papka: vazifalar-api
      - name: Sinov TLS sertifikati (bildirishnoma.test)
        run: |
          mkdir -p "$KANON_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" -keyout "$KANON_TLS/kalit.pem" -out "$KANON_TLS/sert.pem"
      # test bazalari — Prisma migratsiyalari (namunasiz). Namuna bazasi (Aziz, demo parol — ombor-modul.test) — sql/ dan, lokal skriptlar/qur.sh dagidek.
      # 34 #02 1-yugurish: 31/33 dagi `npm run db:seed` (seed.ts — …@seed.example foydalanuvchilar) namunani BERMAYDI → 3 test yiqildi (CI hech yurmagan edi)
      - name: Test bazalari va namuna bazasi
        run: |
          for b in vazifalar_test vazifalar_test_prisma vazifalar_test_auth; do
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE $b"
            DATABASE_URL=postgres://postgres@127.0.0.1:5432/$b npx prisma migrate deploy
          done
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE vazifalar"
          for f in ../sql/*.sql; do psql -h 127.0.0.1 -U postgres -d vazifalar -q -1 -v ON_ERROR_STOP=1 -f "$f" > /dev/null; done
          echo "namuna: $(psql -h 127.0.0.1 -U postgres -d vazifalar -Atc 'SELECT count(*) FROM foydalanuvchilar') foydalanuvchi"
      - run: npm run tip
      - run: npm run lint
      # 2 vCPU runner — DB testlari parallel yukda flaky bo'lgan (31 #34)
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      # #04: artefakt — job'lar orasida fayl uzatish (keyingi job yoki odam yuklab oladi); saqlash muddati qisqa (joy limiti)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-dist
          path: vazifalar-api/dist/
          retention-days: 3
      - name: Migratsiyalar ↔ schema.prisma (drift bo'lmasin)
        run: DATABASE_URL=postgres://postgres@127.0.0.1:5432/vazifalar_test npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Bog'liqliklar auditi (prod)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: web (format, lint, tip, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vazifalar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-tayyorla
        with:
          papka: vazifalar
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_URL: /v1
          VITE_AUTH_URL: /v1/auth
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: vazifalar/dist/
          retention-days: 3

  # #04: needs + artefaktni boshqa job'da olish (masalan, deploy job'i build'ni qayta qilmaydi)
  artefakt:
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: olingan
      - run: du -sh olingan/* && find olingan -type f | wc -l

  # #02: matrix — bir xil job ikki arxitekturada (x64 va arm64 runner; ochiq repoda ikkalasi bepul). Tez job (faqat tip) — daqiqa tejaladi
  arxitektura:
    name: tip (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vazifalar-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-tayyorla
        with:
          papka: vazifalar-api
      - run: echo "arch=$(uname -m) cpu=$(nproc) node=$(node -v) mem=$(free -m | awk '/Mem/{print $2}')MB"
      - run: npm run tip
