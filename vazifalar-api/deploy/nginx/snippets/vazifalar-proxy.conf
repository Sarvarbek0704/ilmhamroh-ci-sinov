# /etc/nginx/snippets/vazifalar-proxy.conf — 33 #22: API'ga uzatish (har location'da bir xil). API TRUST_PROXY=1 — X-Forwarded-* ga ishonadi (faqat shu proxy orqali)
proxy_pass http://vazifalar_api;
proxy_http_version 1.1;                  # upstream keepalive uchun
proxy_set_header Connection "";          # "close" yubormasin
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # $proxy_add_x_forwarded_for EMAS: mijoz yuborgan soxta X-Forwarded-For'ni ulamaymiz (#22)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
