# /etc/nginx/snippets/vazifalar-sarlavhalar.conf — 33 #24: SPA (statik) javoblar sarlavhalari. vercel.json (17–22) dagidek; connect-src 'self' — API bir origin'da.
# add_header meros qoidasi: location'da BIRORTA add_header bo'lsa, yuqoridagilar meros OLINMAYDI — shuning uchun har statik location shu faylni include qiladi.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types vazifalar" always;
