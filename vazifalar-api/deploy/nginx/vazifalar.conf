# /etc/nginx/conf.d/vazifalar.conf — 33-qism #20–#25 (O-21…O-26): vazifalar (SPA) + vazifalar-api BIR ORIGIN'da (28-qism qarori: BFF kerak emas).
#   /          — web build (dist/) — statik, SPA zaxirasi index.html
#   /v1/       — API (upstream vazifalar_api; Node tashqariga ochilmagan)
#   /health/   — faqat ichkaridan (tashqaridan 403)
# __DOMEN__ — o'rnatishda sed bilan almashtiriladi (lokal VPS: vazifalar.lokal; server: sinov.wisar.uz). __API__ — upstream manzili.
# Tekshirish: sudo nginx -t && sudo systemctl reload nginx  (restart EMAS — ulanishlar uzilmaydi)

# --- http konteksti (conf.d/*.conf http {} ichiga include qilinadi) ---
upstream vazifalar_api {
    # #25 o'lchovi: zone'siz har worker o'z round-robin holatini saqlaydi — yangi ulanishlar hammasi 1-serverga ketdi (10/10); zone bilan 5/5
    zone vazifalar_api 64k;
    server __API__ max_fails=3 fail_timeout=10s;
    keepalive 16;                     # Node bilan TCP ulanishlarni qayta ishlatish (#25 o'lchovi)
}

# #24: so'rov tezligi — IP bo'yicha; auth yo'llari qattiqroq (API'ning o'z cheklagichi — ikkinchi qavat)
limit_req_zone $binary_remote_addr zone=api_umumiy:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ulanish:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMEN__;
    server_tokens off;
    # Let's Encrypt HTTP-01 (#19) — certbot --webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMEN__;

    ssl_certificate     /etc/nginx/tls/__DOMEN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/__DOMEN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vazifalar_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;                # versiya sarlavhada va xato sahifasida ko'rinmasin (#24)
    client_max_body_size 12m;         # fayl ilovalari: API chegarasi 10 MB + multipart zaxirasi (#24)
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn ulanish 50;

    # siqish (#23): gzip — nginx'da bor; brotli — alohida modul (nginx.org paketida yo'q)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    root /var/www/vazifalar;
    index index.html;

    # DIQQAT (#24 o'lchovi, tajriba/nginx/24-sarlavha-meros-xato.conf): add_header server darajasida bo'lsa /v1/ javobiga ham tushadi —
    # API'ning o'z CSP'si bilan IKKITA CSP (brauzer ikkalasini ham qo'llaydi). Shuning uchun SPA sarlavhalari faqat statik location'larda (include).

    # API (#22)
    location /v1/ {
        limit_req zone=api_umumiy burst=40 nodelay;
        include /etc/nginx/snippets/vazifalar-proxy.conf;
        proxy_read_timeout 60s;       # AI deadline 25 s + zaxira
    }
    # SSE oqimlari: API o'zi `X-Accel-Buffering: no` yuboradi (bufer o'chadi); bu yerda — uzoq o'qish
    location ~ ^/v1/(oqim|vazifalar/oqim|vazifalar/[0-9]+/qadamlar)$ {
        limit_req zone=api_umumiy burst=40 nodelay;
        include /etc/nginx/snippets/vazifalar-proxy.conf;
        proxy_read_timeout 1h;
    }
    # login/ro'yxat/parol tiklash — qattiq tezlik (#24)
    location ~ ^/v1/auth/(kirish|royxat|parol-tiklash) {
        limit_req zone=api_auth burst=5 nodelay;
        include /etc/nginx/snippets/vazifalar-proxy.conf;
    }
    # health — faqat ichkaridan (monitoring serverning o'zida yoki SSH tunnel)
    location /health/ {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/snippets/vazifalar-proxy.conf;
    }

    # hash'li build fayllari — bir yil, immutable (#23); nomida hash yo'q js/ikonlar — 1 soat
    location ^~ /assets/ {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        # `always` YO'Q (#23 topilmasi): bo'lmasa 404 javob ham "immutable, 1 yil" bilan ketadi — deploy paytida yo'q fayl brauzer/CDN keshida 404 bo'lib qotadi
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        location ~ ^/assets/(js|ikonlar)/ {
            include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
            add_header Cache-Control "public, max-age=3600";
        }
    }
    location = /sw.js {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        add_header Cache-Control "no-cache" always;
    }
    # #23 topilmasi: kengaytmali yo'q fayl (/yoq.png) SPA zaxirasi bilan 200 text/html qaytarardi — fayl so'rovi 404 olsin
    location ~* ^/(?!v1/|health/).*\.(png|jpe?g|gif|svg|ico|webp|avif|js|css|map|json|txt|woff2?)$ {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        try_files $uri =404;
    }
    # nginx mime.types da webmanifest yo'q — application/octet-stream ketardi (#23 o'lchovi)
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        types { } default_type application/manifest+json;
    }
    # SPA: mavjud fayl bo'lmasa — index.html (router tanlaydi); index.html o'zi keshlanmaydi
    location / {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        try_files $uri /index.html;
    }
    location = /index.html {
        include /etc/nginx/snippets/vazifalar-sarlavhalar.conf;
        add_header Cache-Control "no-cache" always;
    }
}
