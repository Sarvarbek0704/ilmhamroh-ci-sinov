# /etc/systemd/journald.conf.d/10-vazifalar.conf — 33-qism #08 (O-08): journal diskni to'ldirmasin.
# Sukut: SystemMaxUse = fayl tizimining 10 % i (4 GB gacha). Kichik VPS'da (40 GB) — 4 GB log; aniq chegara qo'yamiz.
# Qo'llash: sudo systemctl restart systemd-journald ; tekshirish: journalctl --disk-usage
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=1month
