# qoidalar.yml — 34-qism #16/#18: alert qoidalari (SLO bilan bog'liq — QADAMLAR #18). `for` — qisqa uzilishda bezovta qilmaslik (alert fatigue).
groups:
  - name: vazifalar
    rules:
      - alert: ApiNusxasiYoq
        expr: up{job="vazifalar-api"} == 0
        for: 30s
        labels: { daraja: ogohlantirish }
        annotations: { xulosa: "{{ $labels.instance }} javob bermayapti (30 s)" }
      - alert: SaytYoq
        expr: probe_success{job="uptime"} == 0
        for: 30s
        labels: { daraja: jiddiy }
        annotations: { xulosa: "{{ $labels.instance }} — probe muvaffaqiyatsiz (30 s)" }
      - alert: Xatolar5xxKop
        # SLO: 5xx ulushi 5 daqiqada 1 % dan oshmasin
        expr: sum(rate(http_sorovlar_jami{status=~"5.."}[5m])) / clamp_min(sum(rate(http_sorovlar_jami[5m])), 1e-9) > 0.01
        for: 1m
        labels: { daraja: jiddiy }
        annotations: { xulosa: "5xx ulushi {{ $value | humanizePercentage }} (> 1 %)" }
      - alert: SekinJavob
        expr: histogram_quantile(0.99, sum by (le) (rate(http_sorov_davomiyligi_soniya_bucket[5m]))) > 1
        for: 2m
        labels: { daraja: ogohlantirish }
        annotations: { xulosa: "p99 {{ $value | humanizeDuration }} (> 1 s)" }
      - alert: SertifikatTugayapti
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        labels: { daraja: ogohlantirish }
        annotations: { xulosa: "{{ $labels.instance }} sertifikati {{ $value | humanize }} kunda tugaydi" }
