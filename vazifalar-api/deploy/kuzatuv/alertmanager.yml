# alertmanager.yml — 34-qism #16: guruhlash, takrorlash oralig'i, email (lokal — Mailpit; haqiqiy SMTP/Telegram — sinalmagan)
route:
  receiver: pochta
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: pochta
    email_configs:
      - to: navbatchi@vazifalar.example
        from: alert@vazifalar.example
        smarthost: alertpochta:1025
        require_tls: false
        send_resolved: true
