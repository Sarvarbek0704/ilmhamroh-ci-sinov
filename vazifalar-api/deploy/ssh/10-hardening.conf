# /etc/ssh/sshd_config.d/10-hardening.conf — 33-qism #13 (O-13). Asosiy sshd_config'ga tegilmaydi (paket yangilanishida to'qnashuv yo'q).
# Ubuntu 24.04: sshd_config boshida `Include /etc/ssh/sshd_config.d/*.conf` — bu yerdagi qiymat BIRINCHI uchragani sifatida ustun.
# Qo'llash: sudo sshd -t && sudo systemctl reload ssh — eski sessiyani YOPMANG, yangi oynada kirib ko'ring.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers deploy
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
# -L tunnel (#12, DB'ga xavfsiz ulanish) kerak — qoldiriladi; kerak bo'lmasa: AllowTcpForwarding no
