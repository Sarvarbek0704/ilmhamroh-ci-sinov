# compose.bluegreen.yaml — 34-qism #07 (O-49): uzilishsiz deploy uchun qatlam (compose.yaml + compose.prod.yaml USTIGA):
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.bluegreen.yaml up -d
# api va web — IKKITADAN nusxa ("ko'k" = asl nom, "yashil" = -yashil). Deploy birma-bir yangilaydi: biri qayta yaratilayotganda ikkinchisi javob beradi.
#   web ichidagi nginx: upstream'da ikkala api (`resolve` — Docker DNS'dan qayta-qayta), host nginx: ikkala web (4790, 4791).
# Resurs chegarasi baribir jami ≤ 2 CPU / 2 GB (asosiy server qoidasi): ikkinchi nusxalar uchun boshqalar kichraytirildi (o'lchangan bo'sh holat:
#   api 172 MiB, ishchi 83, db 72, redis 16, web 14, pochta 20 MiB — 34 #01). Yig'indi: 1.95 CPU, 2048 MiB.
services:
  db:
    deploy: { resources: { limits: { cpus: "0.40", memory: 448M } } }
  redis:
    deploy: { resources: { limits: { cpus: "0.15", memory: 128M } } }
  migratsiya:
    deploy: { resources: { limits: { cpus: "0.25", memory: 256M } } }
  ishchi:
    deploy: { resources: { limits: { cpus: "0.20", memory: 320M } } }
  pochta:
    deploy: { resources: { limits: { cpus: "0.05", memory: 32M } } }

  api:
    deploy: { resources: { limits: { cpus: "0.35", memory: 384M } } }
  # ikkinchi nusxa — api bilan bir xil (extends: faqat compose.yaml dagi asos; prod qo'shimchalari shu yerda qayta yozilgan)
  api-yashil:
    extends: { file: compose.yaml, service: api }
    depends_on:
      migratsiya: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    environment:
      YOPISH_KECHIKISH_MS: "5000"
      TRUST_PROXY: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    deploy: { resources: { limits: { cpus: "0.35", memory: 384M } } }

  web:
    deploy: { resources: { limits: { cpus: "0.10", memory: 48M } } }
  web-yashil:
    extends: { file: compose.yaml, service: web }
    ports: !override
      - "127.0.0.1:${WEB_YASHIL_PORT:-4791}:8080"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs: ["/var/cache/nginx:uid=101,gid=101", "/run:uid=101,gid=101", "/tmp:uid=101,gid=101"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    deploy: { resources: { limits: { cpus: "0.10", memory: 48M } } }
